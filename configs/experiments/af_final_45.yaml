# Task 2 final AdaptFormer run (Colab A100 40 GB): the laptop-tuned recipe on all 45
# labelled images/class for the full course budget (2 x 48 GB-hours = about 2.4 h on a
# 40 GB card; the cosine schedule is fitted to the clock and `epochs` is only an upper
# bound, about 11 epochs expected). No internal holdout (val_per_class: 0), so no
# step-zero gate and no best.pt: predict from last.pt. Starts from the original
# pretrained backbone (never from a full-FT checkpoint).
# Recipe = af_e_combined_e3 (76.26% at 3 epochs on the 40/5 split, +0.99 over the
# control; docs/RESULTS.md "Task 2 AdaptFormer"): AdaptFormer width 192 in all
# 12 blocks (3,550,464 params = 4.13% of the backbone, head excluded), normalized
# input, PCA init, learned per-block scale (starts 0.1), adapter lr 1e-3, prototype
# cosine head at head lr 4e-3, CosFace margin 0.1, label smoothing 0.1, AdamW wd 0.05
# (none on 1-D params), clip 1.0, effective batch 256, bf16, 5% warmup then cosine to zero.
# The 336 px prototypes were built from the 40-image split (as in full_proto_final_45);
# they are only the head's starting point. The notebook stages them as
# class_prototypes_336.pt from My Drive/cs604/inputs/.
data_root: "/content/cs604-course-data"
output_dir: "/content/drive/MyDrive/outputs/af_final_45"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
num_classes: 10000
image_size: 336
mode: adaptformer
adapter_dim: 192
adapter_scale: 0.1
adapter_scale_trainable: true
adapter_dropout: 0.0
adapter_input: norm
adapter_init: pca
head_type: cosine
cosine_head_fp32: true
train_head: true
prototype_file: "/content/cs604-inputs/class_prototypes_336.pt"
batch_size: 128
eval_batch_size: 256
grad_accum: 2
num_workers: 10
epochs: 30
budget_48gb_hours: 2.0
max_steps: null
train_per_class: null
val_per_class: 0
split_seed: 604
validate: false
lr: 0.001
head_lr: 0.004
no_decay_norm_bias: true
weight_decay: 0.05
label_smoothing: 0.1
cosine_margin: 0.1
drop_path_rate: 0.0
clip_grad_norm: 1.0
precision: bf16
grad_checkpointing: false
log_every: 50
ckpt_every: 2000
seed: 0
synthetic: false
resume: null
