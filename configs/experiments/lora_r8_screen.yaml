# LoRA rank-8 screening run. The random linear head is included in trainable count.
data_root: "data"
output_dir: "outputs/lora-r8-screen"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
num_classes: 10000
image_size: 224
mode: lora
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.05
head_type: linear
train_head: true
batch_size: 32
eval_batch_size: 64
grad_accum: 1
num_workers: 4
epochs: 2
max_steps: null
train_per_class: 10
val_per_class: 5
split_seed: 604
validate: true
lr: 0.0003
weight_decay: 0.01
label_smoothing: 0.1
precision: bf16
grad_checkpointing: false
log_every: 100
ckpt_every: 1000
seed: 0
synthetic: false
resume: null
