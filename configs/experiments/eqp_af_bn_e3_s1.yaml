# Equal-parameter controls for AdaptFormer + LoRA r16 (4.96%), Colab A100 (2026-11-03).
# Same recipe, holdout (split seed 604, 40/5) and 3 epochs as af_lora_r16_e3; all four arms
# and both seeds run on Colab so the comparison shares one GPU type and library version.
# Arms: eqp_af_bn (AF w192 + biases/norms, 4.27%), eqp_af_lora16 (AF w192 + LoRA r16 qkv,
# 4.96%), eqp_af224 (AF w224 + biases/norms, 4.96%), eqp_lora28 (no AF; LoRA r28 on
# qkv/proj/fc1/fc2 + biases/norms, 4.95%). If eqp_af_lora16 beats both 4.96% controls,
# the combination matters; if eqp_af224 ties it, the +0.57 was the extra parameters.
# This arm: AF w192 + biases/norms (laptop af_bn_bias_norm_e3: 76.756). Seed 1.
