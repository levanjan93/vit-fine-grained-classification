# 5-step probe. Confirms the RTX 5080 path before a real run.
# Add --synthetic until train.tar.gz has been extracted.

data_root: "data"
output_dir: "outputs/smoke"
timm_checkpoint: "vit_base_patch16_224.augreg2_in21k_ft_in1k"
num_classes: 10000
image_size: 224

batch_size: 4
grad_accum: 1
num_workers: 0
epochs: 1
max_steps: 5
limit_samples: 32
lr: 0.0001
weight_decay: 0.05
precision: bf16
grad_checkpointing: true
log_every: 1
ckpt_every: 5
seed: 0
synthetic: false
resume: null
